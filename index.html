<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/weather-svgrepo-com.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic SEO -->
    <title>Weather Dashboard | Global Real-time Weather Center - Precise Forecasts & Dynamic Maps</title>
    <meta name="description" content="Professional real-time weather dashboard featuring global city search, dynamic 5-day forecasts, precipitation trend analysis, and interactive maps. Designed for data visualization and RWD reading experience." />
    <meta name="keywords" content="Weather, Forecast, Dashboard, React, Tailwind, Weather Dashboard, Precipitation, Meteorologic Information" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Weather Dashboard | Global Real-time Weather Center" />
    <meta property="og:description" content="Integrated global real-time weather data, dynamic precipitation charts, and interactive maps for a professional monitoring experience." />
    <meta property="og:image" content="/weather-svgrepo-com.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Weather Dashboard | Precise Meteorological Trends" />
    <meta name="twitter:description" content="Global real-time weather data, dynamic precipitation charts, and interactive maps with intuitive data presentation." />
    <meta name="twitter:image" content="/weather-svgrepo-com.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="text/javascript">
      // 避免 Dark Mode 在 JS 載入前閃爍 (Flash of unstyled content)
      (function () {
        const isDark =
          localStorage.getItem('weather-dashboard-theme') === 'dark' ||
          (!('weather-dashboard-theme' in localStorage) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
